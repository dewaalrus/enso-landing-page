<svg width="180" height="180" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <!-- Enso Mark — Circle + Serif e
       Bold brushstroke enso circle with EB Garamond lowercase "e" centered.
       Supports light/dark mode via prefers-color-scheme. -->
  <style>
    @media (prefers-color-scheme: light) {
      .s { stroke: #1a1a1a; }
      .t { fill: #1a1a1a; }
    }
    @media (prefers-color-scheme: dark) {
      .s { stroke: #faf8f5; }
      .t { fill: #faf8f5; }
    }
  </style>

  <!-- Core stroke -->
  <path class="s" d="M 20 5.5 C 25 7, 28 10.5, 28.5 16 C 29 21.5, 27 26.5, 23 28.5 C 19 30.5, 13.5 30.5, 9.5 28.2 C 5.5 26, 3 22, 3 17 C 3 12, 5.5 8, 9.8 6.2 C 13 4.7, 16 4.7, 17.5 5.2" fill="none" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Heavy pressure — left downstroke -->
  <path class="s" d="M 9.5 28.2 C 5.5 26, 3 22, 3 17 C 3 12, 5.5 8, 9.8 6.2" fill="none" stroke-width="4.2" stroke-linecap="round" opacity="0.85"/>

  <!-- Bottom arc -->
  <path class="s" d="M 23 28.5 C 19 30.5, 13.5 30.5, 9.5 28.2" fill="none" stroke-width="3.5" stroke-linecap="round" opacity="0.75"/>

  <!-- Right upstroke -->
  <path class="s" d="M 28 10.5 C 28.5 14, 29 18.5, 28.5 21.5 C 28 24.5, 26 27, 23 28.5" fill="none" stroke-width="3" stroke-linecap="round" opacity="0.7"/>

  <!-- Serif e -->
  <text class="t" x="16" y="21.5" text-anchor="middle" font-family="'EB Garamond', 'Georgia', serif" font-size="16" font-weight="500">e</text>
</svg>
